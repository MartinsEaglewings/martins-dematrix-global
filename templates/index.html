<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Martins DeMatrix</title>
  <style>
    :root {
      --bg-dark: #0d0202;
      --card-bg: #1a0505;
      --card-inner: #260808;
      --bright-red: #ff1a1a;
      --dark-red: #b30000;
      --bright-gold: #ffd700;
      --accent-gold: #ffae00;
      --text-light: #fff8e7;
      --text-muted: #d9b38c;
      --border-red: rgba(255, 26, 26, 0.4);
      --border-gold: rgba(255, 215, 0, 0.5);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      background-image: radial-gradient(circle at 50% 0%, #330000 0%, #0d0202 80%);
      color: var(--text-light);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: linear-gradient(180deg, #2b0000 0%, #1a0505 100%);
      border-bottom: 2px solid var(--bright-gold);
      padding: 1rem 1.5rem;
      display: none;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 15px rgba(255, 215, 0, 0.15);
    }

    .brand-title {
      font-size: 1.4rem;
      font-weight: 900;
      color: var(--bright-gold);
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
    }

    .user-pill {
      background: var(--card-inner);
      padding: 0.4rem 1rem;
      border-radius: 20px;
      font-size: 0.9rem;
      color: var(--bright-red);
      border: 1px solid var(--bright-gold);
      font-weight: 800;
    }

    .container {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      padding: 1.2rem;
      flex: 1;
    }

    .auth-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 80vh;
    }

    .auth-card {
      background: var(--card-bg);
      border: 2px solid var(--bright-gold);
      border-radius: 14px;
      padding: 2.2rem;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 0 25px rgba(255, 26, 26, 0.3);
    }

    .auth-title {
      text-align: center;
      margin-bottom: 1.5rem;
      color: var(--bright-red);
      font-size: 1.6rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      text-shadow: 0 0 8px rgba(255, 26, 26, 0.6);
    }

    .form-group {
      margin-bottom: 1.2rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.4rem;
      font-size: 0.85rem;
      color: var(--bright-gold);
      font-weight: 700;
    }

    .form-group input {
      width: 100%;
      padding: 0.8rem;
      background-color: var(--card-inner);
      border: 1px solid var(--border-gold);
      border-radius: 8px;
      color: var(--text-light);
      outline: none;
    }

    .form-group input:focus {
      border-color: var(--bright-red);
      box-shadow: 0 0 8px var(--bright-red);
    }

    .btn {
      width: 100%;
      padding: 0.85rem;
      border: none;
      border-radius: 8px;
      font-weight: 900;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: transform 0.1s ease;
    }

    .btn-gold {
      background: linear-gradient(135deg, var(--accent-gold) 0%, var(--bright-gold) 100%);
      color: #000;
      box-shadow: 0 0 12px rgba(255, 215, 0, 0.4);
    }

    .btn-red {
      background: linear-gradient(135deg, var(--dark-red) 0%, var(--bright-red) 100%);
      color: var(--text-light);
      box-shadow: 0 0 12px rgba(255, 26, 26, 0.4);
    }

    .toggle-auth {
      text-align: center;
      margin-top: 1.2rem;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .toggle-auth span {
      color: var(--bright-gold);
      cursor: pointer;
      font-weight: 800;
      text-decoration: underline;
    }

    #app-interface {
      display: none;
    }

    /* ONLINE USERS BAR */
    .online-section {
      background: var(--card-bg);
      border: 1.5px solid var(--bright-gold);
      border-radius: 12px;
      padding: 1rem;
      margin-bottom: 1.5rem;
      box-shadow: 0 0 15px rgba(255, 215, 0, 0.1);
    }

    .online-list {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      margin-top: 0.6rem;
    }

    .user-chip {
      background: var(--card-inner);
      border: 1px solid var(--bright-red);
      padding: 0.4rem 0.9rem;
      border-radius: 20px;
      font-size: 0.85rem;
      color: var(--bright-gold);
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .user-chip:hover {
      border-color: var(--bright-gold);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background-color: var(--bright-gold);
      border-radius: 50%;
      box-shadow: 0 0 6px var(--bright-gold);
    }

    .unread-badge {
      background: var(--bright-red);
      color: #fff;
      font-size: 0.7rem;
      padding: 0.1rem 0.4rem;
      border-radius: 10px;
      font-weight: 900;
      box-shadow: 0 0 6px var(--bright-red);
    }

    .post-box {
      background: var(--card-bg);
      border: 1.5px solid var(--bright-gold);
      border-radius: 12px;
      padding: 1.2rem;
      margin-bottom: 2rem;
      box-shadow: 0 0 15px rgba(255, 215, 0, 0.1);
    }

    .section-title {
      font-size: 0.9rem;
      color: var(--bright-gold);
      text-transform: uppercase;
      font-weight: 900;
      letter-spacing: 1.5px;
      margin-bottom: 0.8rem;
    }

    .post-box textarea {
      width: 100%;
      height: 90px;
      background-color: var(--card-inner);
      border: 1px solid var(--border-gold);
      border-radius: 8px;
      color: var(--text-light);
      padding: 0.8rem;
      outline: none;
      resize: none;
      margin-bottom: 0.8rem;
    }

    .post-box textarea:focus {
      border-color: var(--bright-red);
    }

    .post-actions {
      display: flex;
      justify-content: flex-end;
    }

    .post-actions .btn {
      width: auto;
      padding: 0.6rem 2rem;
    }

    .feed-container {
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }

    .post-card {
      background: var(--card-bg);
      border: 1px solid var(--border-red);
      border-left: 5px solid var(--bright-gold);
      border-radius: 10px;
      padding: 1.2rem;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
    }

    .post-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 0.6rem;
    }

    .post-author {
      font-weight: 800;
      color: var(--bright-red);
      cursor: pointer;
    }

    .post-author:hover {
      text-decoration: underline;
    }

    .post-time {
      font-size: 0.75rem;
      color: var(--bright-gold);
    }

    .post-content {
      font-size: 0.95rem;
      line-height: 1.5;
      color: var(--text-light);
    }

    /* PRIVATE CHAT MODAL */
    .pm-modal {
      display: none;
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 340px;
      max-width: 90vw;
      background: var(--card-bg);
      border: 2px solid var(--bright-gold);
      border-radius: 12px;
      box-shadow: 0 0 25px rgba(255, 26, 26, 0.5);
      z-index: 1000;
      flex-direction: column;
      overflow: hidden;
    }

    .pm-header {
      background: linear-gradient(180deg, #2b0000 0%, #1a0505 100%);
      padding: 0.8rem 1rem;
      border-bottom: 1px solid var(--bright-gold);
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--bright-gold);
      font-weight: 800;
    }

    .pm-close {
      cursor: pointer;
      color: var(--bright-red);
      font-size: 1.2rem;
      font-weight: 900;
    }

    .pm-messages {
      height: 240px;
      padding: 0.8rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      background: var(--card-inner);
    }

    .pm-bubble {
      max-width: 80%;
      padding: 0.6rem 0.8rem;
      border-radius: 10px;
      font-size: 0.85rem;
      line-height: 1.3;
    }

    .pm-sent {
      align-self: flex-end;
      background: var(--dark-red);
      color: #fff;
      border: 1px solid var(--bright-red);
    }

    .pm-received {
      align-self: flex-start;
      background: #331a00;
      color: var(--bright-gold);
      border: 1px solid var(--bright-gold);
    }

    .pm-input-area {
      display: flex;
      padding: 0.6rem;
      background: var(--card-bg);
      border-top: 1px solid var(--border-gold);
      gap: 0.4rem;
    }

    .pm-input-area input {
      flex: 1;
      padding: 0.5rem;
      background: var(--card-inner);
      border: 1px solid var(--border-gold);
      border-radius: 6px;
      color: var(--text-light);
      outline: none;
    }

    .pm-input-area button {
      padding: 0.5rem 1rem;
      border: none;
      border-radius: 6px;
      background: var(--bright-gold);
      color: #000;
      font-weight: 900;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header id="main-header">
    <div class="brand-title">DeMatrix Global</div>
    <div id="logged-user-pill" class="user-pill"></div>
  </header>

  <div class="container">

    <div id="auth-container" class="auth-wrapper">
      
      <!-- DEFAULT SCREEN: SIGN UP -->
      <div id="signup-card" class="auth-card">
        <h2 class="auth-title">Sign Up First</h2>
        <form id="signup-form">
          <div class="form-group">
            <label>Username</label>
            <input type="text" id="signup-username" placeholder="Choose username" required />
          </div>
          <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="signup-email" placeholder="enter@email.com" required />
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" id="signup-password" placeholder="••••••••" required />
          </div>
          <button type="submit" class="btn btn-gold">Create Account</button>
        </form>
        <div class="toggle-auth">
          Already registered? <span onclick="showAuth('login')">Log In</span>
        </div>
      </div>

      <!-- SECOND SCREEN: LOG IN -->
      <div id="login-card" class="auth-card" style="display: none;">
        <h2 class="auth-title">Account Login</h2>
        <form id="login-form">
          <div class="form-group">
            <label>Username or Email</label>
            <input type="text" id="login-identity" placeholder="Username or Email" required />
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" id="login-password" placeholder="••••••••" required />
          </div>
          <button type="submit" class="btn btn-red">Log In</button>
        </form>
        <div class="toggle-auth">
          Need an account? <span onclick="showAuth('signup')">Sign Up First</span>
        </div>
      </div>

    </div>

    <!-- PUBLIC CHAT SECTION & ONLINE USERS -->
    <div id="app-interface">
      
      <!-- ONLINE USERS LIST -->
      <div class="online-section">
        <div class="section-title">Online Members (Click to PM)</div>
        <div id="online-users-list" class="online-list">
          <!-- Populated dynamically -->
        </div>
      </div>

      <div class="post-box">
        <div class="section-title">Public Chat Stream</div>
        <textarea id="post-input" placeholder="Write a message for all users to see..."></textarea>
        <div class="post-actions">
          <button type="button" class="btn btn-red" onclick="submitPost()">Post Message</button>
        </div>
      </div>

      <div id="feed-container" class="feed-container"></div>
    </div>

  </div>

  <!-- PRIVATE CHAT POPUP PANEL -->
  <div id="pm-modal" class="pm-modal">
    <div class="pm-header">
      <span id="pm-target-title">PM with Target</span>
      <span class="pm-close" onclick="closePM()">✕</span>
    </div>
    <div id="pm-messages" class="pm-messages"></div>
    <div class="pm-input-area">
      <input type="text" id="pm-input" placeholder="Type a private message..." onkeypress="if(event.key==='Enter') sendPM()" />
      <button onclick="sendPM()">Send</button>
    </div>
  </div>

  <script>
    let currentUser = null;
    let currentPMUser = null;

    function showAuth(type) {
      document.getElementById('signup-card').style.display = type === 'signup' ? 'block' : 'none';
      document.getElementById('login-card').style.display = type === 'login' ? 'block' : 'none';
    }

    document.getElementById('signup-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      const username = document.getElementById('signup-username').value.trim();
      const email = document.getElementById('signup-email').value.trim();
      const password = document.getElementById('signup-password').value.trim();

      const res = await fetch('/api/signup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, email, password })
      });
      const data = await res.json();

      if (res.ok) {
        alert("Registration successful! Please log in now.");
        document.getElementById('signup-form').reset();
        showAuth('login');
      } else {
        alert(data.error || "Sign up failed.");
      }
    });

    document.getElementById('login-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      const identity = document.getElementById('login-identity').value.trim();
      const password = document.getElementById('login-password').value.trim();

      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ identity, password })
      });
      const data = await res.json();

      if (res.ok) {
        currentUser = data.username;
        startUserSession();
      } else {
        alert(data.error || "Invalid login credentials.");
      }
    });

    function startUserSession() {
      document.getElementById('main-header').style.display = 'flex';
      document.getElementById('auth-container').style.display = 'none';
      document.getElementById('app-interface').style.display = 'block';

      const userPill = document.getElementById('logged-user-pill');
      userPill.innerText = `@${currentUser}`;

      fetchPosts();
      fetchOnlineUsers();
      sendHeartbeat();

      setInterval(fetchPosts, 3000);
      setInterval(fetchOnlineUsers, 3000);
      setInterval(sendHeartbeat, 5000);
    }

    async function sendHeartbeat() {
      if (!currentUser) return;
      fetch('/api/heartbeat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: currentUser })
      });
    }

    async function fetchOnlineUsers() {
      const res = await fetch('/api/online-users');
      if (!res.ok) return;
      const users = await res.json();

      const unreadRes = await fetch(`/api/unread-counts?username=${encodeURIComponent(currentUser)}`);
      const unreadCounts = unreadRes.ok ? await unreadRes.json() : {};

      const container = document.getElementById('online-users-list');
      container.innerHTML = '';

      users.forEach(user => {
        if (user === currentUser) return; // Hide self from list

        const chip = document.createElement('div');
        chip.className = 'user-chip';
        chip.onclick = () => openPM(user);

        const badgeCount = unreadCounts[user] || 0;
        const badgeHTML = badgeCount > 0 ? `<span class="unread-badge">${badgeCount} NEW</span>` : '';

        chip.innerHTML = `
          <span class="status-dot"></span>
          <span>@${user}</span>
          ${badgeHTML}
        `;
        container.appendChild(chip);
      });

      if (container.children.length === 0) {
        container.innerHTML = '<span style="font-size:0.85rem; color:var(--text-muted);">No other users online right now</span>';
      }
    }

    async function submitPost() {
      const input = document.getElementById('post-input');
      const text = input.value.trim();
      if (!text) {
        alert("Please write a message before posting.");
        return;
      }

      const res = await fetch('/api/posts', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ author: currentUser, content: text })
      });

      if (res.ok) {
        input.value = '';
        fetchPosts();
      } else {
        const data = await res.json();
        alert(data.error || "Posting failed.");
      }
    }

    async function fetchPosts() {
      const res = await fetch('/api/posts');
      if (!res.ok) return;
      const posts = await res.json();
      
      const container = document.getElementById('feed-container');
      container.innerHTML = '';
      posts.forEach(post => {
        const card = document.createElement('div');
        card.className = 'post-card';
        card.innerHTML = `
          <div class="post-header">
            <span class="post-author" onclick="openPM('${post.author}')">@${post.author}</span>
            <span class="post-time">${post.timestamp}</span>
          </div>
          <div class="post-content">${post.content}</div>
        `;
        container.appendChild(card);
      });
    }

    /* PRIVATE MESSAGING LOGIC */
    let pmInterval = null;

    function openPM(targetUser) {
      if (targetUser === currentUser) return;
      currentPMUser = targetUser;
      document.getElementById('pm-target-title').innerText = `PM with @${targetUser}`;
      document.getElementById('pm-modal').style.display = 'flex';
      fetchPMMessages();

      if (pmInterval) clearInterval(pmInterval);
      pmInterval = setInterval(fetchPMMessages, 2000);
    }

    function closePM() {
      document.getElementById('pm-modal').style.display = 'none';
      currentPMUser = null;
      if (pmInterval) clearInterval(pmInterval);
      fetchOnlineUsers();
    }

    async function fetchPMMessages() {
      if (!currentPMUser || !currentUser) return;
      const res = await fetch(`/api/private-messages?user1=${encodeURIComponent(currentUser)}&user2=${encodeURIComponent(currentPMUser)}`);
      if (!res.ok) return;
      const messages = await res.json();

      const container = document.getElementById('pm-messages');
      container.innerHTML = '';
      messages.forEach(msg => {
        const bubble = document.createElement('div');
        const isSelf = msg.sender === currentUser;
        bubble.className = `pm-bubble ${isSelf ? 'pm-sent' : 'pm-received'}`;
        bubble.innerText = msg.content;
        container.appendChild(bubble);
      });
      container.scrollTop = container.scrollHeight;
    }

    async function sendPM() {
      const input = document.getElementById('pm-input');
      const text = input.value.trim();
      if (!text || !currentPMUser) return;

      const res = await fetch('/api/private-messages', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ sender: currentUser, recipient: currentPMUser, content: text })
      });

      if (res.ok) {
        input.value = '';
        fetchPMMessages();
      }
    }
  </script>
</body>
</html>
